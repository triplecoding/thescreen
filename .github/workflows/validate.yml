name: Validate scripts

on:
  push:
    paths: ["scripts/**", "pipeline/validate.py"]
  pull_request:
    paths: ["scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests numpy Pillow
      - run: python pipeline/validate.py

name: "Facebook queue: store finished videos"
# Copies finished videos (from earlier runs' artifacts) into the 'fb-queue' release, so the Facebook catch-up
# uploads exactly those files instead of rendering them again. Safe to run any time; only ids still waiting
# for Facebook (state.json: youtube set, facebook missing) are stored.
on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: "Space-separated artifact ids (videos-NN) to scan"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Store pending videos
        run: |
          PENDING=$(python3 -c "import json;s=json.load(open('state.json'));print(' '.join(p['id'] for p in s['posted'] if p.get('youtube') and not p.get('facebook')))")
          echo "waiting for Facebook: $PENDING"
          gh release view fb-queue >/dev/null 2>&1 || gh release create fb-queue --title "Facebook queue" --prerelease --notes "Finished videos waiting for Facebook (posting limit). Uploaded and removed automatically by daily.py."
          HAVE=$(gh release view fb-queue --json assets --jq '.assets[].name' | tr '\n' ' ')
          for ART in ${{ github.event.inputs.artifacts }}; do
            rm -rf w && mkdir -p w/x
            gh api repos/${{ github.repository }}/actions/artifacts/$ART/zip > w/a.zip || { echo "artifact $ART: download failed"; continue; }
            (cd w/x && unzip -q ../a.zip) ; rm -f w/a.zip
            for f in $(find w/x -name video.mp4); do
              id=$(basename $(dirname $f))
              case " $PENDING " in *" $id "*) ;; *) continue;; esac
              case " $HAVE " in *" $id.mp4 "*) continue;; esac
              cp $f w/$id.mp4 && gh release upload fb-queue w/$id.mp4 --clobber && echo "stored $id" && HAVE="$HAVE $id.mp4 "
            done
          done
          echo "queue now: $(gh release view fb-queue --json assets --jq '.assets|length') videos"

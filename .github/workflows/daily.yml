name: Publish videos

on:
  workflow_dispatch:
    inputs:
      count:
        description: "0 = only the next slot · N = fill N of today's slots"
        default: "0"
      mode:
        description: "scheduled | now | extra (publish one extra video now, keeps all slots) | dry-run"
        default: "scheduled"
      date:
        description: "Date YYYY-MM-DD (blank = today, Asia/Dhaka)"
        default: ""
  schedule:
    # 6 videos/day at 09:00, 11:30, 13:30, 15:30, 17:30, 20:00 Asia/Dhaka (UTC+6). Every run schedules ALL unfilled
    # slots of the next ~26 h on YouTube (publishAt) and Facebook (scheduled_publish_time). Idle runs exit in ~20 s.
    - cron: "25 2 * * *"    # 08:25 Dhaka
    - cron: "55 4 * * *"    # 10:55
    - cron: "55 6 * * *"    # 12:55
    - cron: "55 8 * * *"    # 14:55
    - cron: "55 10 * * *"   # 16:55
    - cron: "25 13 * * *"   # 19:25
    - cron: "13 * * * *"    # hourly safety net

concurrency:
  group: publish-videos
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Dhaka
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GH_TOKEN: ${{ github.token }}   # daily.py keeps videos waiting for Facebook in the 'fb-queue' release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # always the LATEST main (state.json), never the commit from when the run was queued
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan
        id: plan
        run: |
          pip install -q requests
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "scheduled" -o "${{ github.event.inputs.count }}" != "0" -o "${{ github.event.inputs.date }}" != "" ]; then
            echo "work=1" >> "$GITHUB_OUTPUT"; echo "manual run"
          else
            python pipeline/daily.py --plan --ahead 6
          fi
      - name: First comments / playlists (nothing to produce)
        if: steps.plan.outputs.work == '0'
        run: |
          git config user.name "The Screen Bot"
          git config user.email "bot@thescreen.local"
          python pipeline/daily.py --engage-only || true
      - name: System packages
        if: steps.plan.outputs.work == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Node + Chromium
        if: steps.plan.outputs.work == '1'
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Python deps
        if: steps.plan.outputs.work == '1'
        run: pip install -q -r requirements.txt
      - name: Voice cache
        if: steps.plan.outputs.work == '1'
        uses: actions/cache@v4
        with:
          path: .cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-
      - name: Check secrets
        if: steps.plan.outputs.work == '1'
        run: python pipeline/doctor.py --ci
      - name: Produce and publish
        if: steps.plan.outputs.work == '1' && env.SKIP_PRODUCTION != '1'
        run: |
          git config user.name "The Screen Bot"
          git config user.email "bot@thescreen.local"
          ARGS="--ahead 6"
          [ "${{ github.event.inputs.count }}" != "" ] && [ "${{ github.event.inputs.count }}" != "0" ] && ARGS="--count ${{ github.event.inputs.count }}"
          [ "${{ github.event.inputs.mode }}" = "now" ] && ARGS="$ARGS --now"
          [ "${{ github.event.inputs.mode }}" = "extra" ] && ARGS="--extra"
          [ "${{ github.event.inputs.mode }}" = "dry-run" ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.date }}" != "" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          python pipeline/daily.py $ARGS
      - name: Contact sheets for review
        if: always() && steps.plan.outputs.work == '1'
        run: python pipeline/contact_sheet.py || true
      - name: Upload outputs
        if: always() && steps.plan.outputs.work == '1'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            out/*/video.mp4
            out/*/thumb_*.jpg
            out/*/meta.json
            out/*/captions.srt
            out/*/contact.jpg
          retention-days: 7
          if-no-files-found: ignore
      - name: Photo cards (schedule new, comment video links)
        if: always()
        run: |
          git config user.name "The Screen Bot"
          git config user.email "bot@thescreen.local"
          pip install -q requests >/dev/null 2>&1 || true
          python pipeline/photo_posts.py || echo "photo posts: error (ignored)"
      - name: Keep "Produce days ahead" going (future days, while scripts remain)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q origin main >/dev/null 2>&1 || true
          next=$(python pipeline/range_next.py 2>/dev/null || true)
          if [ -z "$next" ]; then echo "nothing to produce ahead now (all days filled, no scripts, or YouTube limit)"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/produce-range.yml/runs?per_page=5" --jq '[.workflow_runs[]|select(.status!="completed")]|length' || echo 1)
          echo "next days: $next · active produce-range runs: $n"
          if [ "$n" = "0" ]; then
            set -- $next
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/produce-range.yml/dispatches" -f ref=main -f "inputs[start]=$1" -f "inputs[end]=$2" && echo "produce-range started: $1 → $2"
          fi
      - name: Make sure the Keeper timer is running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/keeper.yml/runs?per_page=5" --jq '[.workflow_runs[]|select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")]|length' || echo 1)
          echo "active keeper runs: $n"
          if [ "$n" = "0" ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/keeper.yml/dispatches" -f ref=main && echo "keeper restarted"; fi
